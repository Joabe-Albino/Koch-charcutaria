    <script>
        const URL = "https://wy2dx8kh.api.sanity.io/v2025-11-17/data/query/production?query=*[_type == 'carrosselType'] | order(Ordem asc){Nome, 'Imagem_video': Imagem_video.asset->url}&perspective=drafts";

        async function carregarCarrossel() {
            const response = await fetch(URL);
            const json = await response.json();
            const result = json.result;

            const main = document.querySelector('.imgCentral');
            const divSlides = document.createElement("div");
            divSlides.classList.add("slides");

            for (let element of result) {
                const displayUrl = element.Imagem_video;
                let display;

                if (displayUrl.includes(".mp4")) {
                    display = document.createElement("video");
                    display.autoplay = true;
                    display.loop = true;
                    display.muted = true;
                } else if (displayUrl.match(/\.(jpg|jpeg|png)$/)) {
                    display = document.createElement("img");
                    display.setAttribute("alt", element.Nome || "");
                } else {
                    continue;
                }

                display.src = displayUrl;

                const divCard = document.createElement("div");
                divCard.classList.add("slide");
                divCard.append(display);

                divSlides.append(divCard);
            }

            main.append(divSlides);

            // 🔄 Lógica de transição automática
            let currentIndex = 0;
            const totalSlides = divSlides.children.length;

            setInterval(() => {
                currentIndex = (currentIndex + 1) % totalSlides;
                divSlides.style.transform = `translateX(-${currentIndex * 100}%)`;
            }, 4000); // troca a cada 4 segundos
        }

        carregarCarrossel();
    </script>

    <div class="kosh-destaques"><h3>Destaques da semana</h3></div>

    <script>
        const DESTAQUES_URL = "https://wy2dx8kh.api.sanity.io/v2025-12-01/data/query/production?query=*[_type == 'produtosViewType']{ 'Endereco_da_imagem': Endereco_da_imagem.asset->url }&perspective=drafts";

        async function carregarDestaques() {
            const response = await fetch(DESTAQUES_URL);
            const json = await response.json();
            const result = json.result;

            const section = document.getElementById("destaques-section");
            section.innerHTML = "";

            result.slice(0,4).forEach(item => {
                const div = document.createElement("div");
                const img = document.createElement("img");
                img.src = item.Endereco_da_imagem;
                img.alt = "Produto em destaque";
                div.appendChild(img);
                section.appendChild(div);
            });
        }

        document.addEventListener("DOMContentLoaded", carregarDestaques);
    </script>

    <script>
        const PARCEIROS_URL = "https://wy2dx8kh.api.sanity.io/v2025-11-17/data/query/production?query=*[_type == 'parceirosHomeType']{ 'imgUrl': Endereco_da_imagem.asset->url }&perspective=drafts";

        async function carregarEmpresas() {
            const response = await fetch(PARCEIROS_URL);
            const json = await response.json();

            const section = document.querySelector(".container-empresas section");

                img.alt = "Parceiro";

                section.appendChild(divEmpresa);
            }

        document.addEventListener("DOMContentLoaded", carregarEmpresas);
